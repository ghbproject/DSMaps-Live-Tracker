name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build folder distribution
        run: python -m PyInstaller --noconfirm --clean DSMapsLiveTracker.spec
      - name: Add usage guide
        shell: pwsh
        run: Copy-Item README.md dist/DSMapsLiveTracker/README.md
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DSMapsLiveTracker -DestinationPath DSMapsLiveTracker-windows-x64.zip -CompressionLevel Optimal
          (Get-FileHash DSMapsLiveTracker-windows-x64.zip -Algorithm SHA256).Hash + "  DSMapsLiveTracker-windows-x64.zip" | Set-Content SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSMapsLiveTracker-windows-x64
          path: |
            DSMapsLiveTracker-windows-x64.zip
            SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DSMapsLiveTracker-windows-x64.zip
            SHA256SUMS.txt
